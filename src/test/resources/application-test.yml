# Configuração de teste (Testcontainers sobrescreve datasource via DynamicPropertySource)
spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  mvc:
    async:
      request-timeout: ${ASYNC_REQUEST_TIMEOUT:0}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

app:
  jwt:
    # >= 32 bytes (raw fallback) para passar na validacao de forca
    secret: teste-secret-com-no-minimo-256-bits-1234567890
    previous-secret:
    access-expiration-ms: 420000
    refresh-expiration-days: 7
    cookie-secure: false
    cookie-same-site: Lax

  cors:
    allowed-origins: http://localhost:5173

  rate-limit:
    enabled: false

  sse:
    heartbeat-ms: 1000
